name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libgl1 libegl1 libgles2
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q
